name: Release

# Builds the Mac app (Apple Silicon) and the Windows app (x64 + ARM64), then
# publishes them together as one GitHub Release. To cut a new release, change
# the number in VERSION and push to main (or run this workflow from the Actions tab).
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

  mac:
    needs: check
    if: needs.check.outputs.exists != 'true'
    runs-on: macos-latest   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
      - run: |
          chmod +x build.sh
          ./build.sh
          ditto -c -k --keepParent "build/Number Cipher.app" NumberCipher-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: NumberCipher-macOS-arm64.zip

  windows:
    needs: check
    if: needs.check.outputs.exists != 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compatibility self-tests
        run: dotnet run --project windows/InteropTest -c Release
      - name: Build x64 and ARM64 (full and small editions)
        run: |
          for arch in x64 arm64; do
            # Full: bundles the .NET runtime, runs on any PC with nothing installed.
            dotnet publish windows/NumberCipher.Windows -c Release -r win-$arch --self-contained \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=true \
              -p:Version=${{ needs.check.outputs.version }} \
              -o out/$arch
            cp out/$arch/NumberCipher.exe NumberCipher-Windows-$arch.exe
            # Small: uses the PC's installed .NET Desktop Runtime (8 or newer).
            dotnet publish windows/NumberCipher.Windows -c Release -r win-$arch --self-contained false \
              -p:PublishSingleFile=true \
              -p:Version=${{ needs.check.outputs.version }} \
              -o out/$arch-small
            cp out/$arch-small/NumberCipher.exe NumberCipher-Windows-$arch-small.exe
          done
          ls -l NumberCipher-Windows-*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: NumberCipher-Windows-*.exe

  publish:
    needs: [check, mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          cp recover.py dist/
          (cd dist && sha256sum NumberCipher-* recover.py > SHA256SUMS.txt && cat SHA256SUMS.txt)
          cat > notes.md <<'EOF'
          | Download | For |
          |---|---|
          | `NumberCipher-macOS-arm64.zip` | Mac with Apple Silicon (M1–M4 and newer), macOS 14+ |
          | `NumberCipher-Windows-x64.exe` | Most Windows 10/11 PCs (Intel or AMD) |
          | `NumberCipher-Windows-arm64.exe` | Windows on ARM (Snapdragon, Surface Pro X, etc.) |
          | `NumberCipher-Windows-x64-small.exe` | Small edition for Intel/AMD PCs that have the [.NET Desktop Runtime](https://dotnet.microsoft.com/download/dotnet) 8 or newer installed |
          | `NumberCipher-Windows-arm64-small.exe` | Small edition for Windows on ARM, same requirement |
          | `recover.py` | Decrypts codes on any computer with Python (`pip3 install cryptography`) |

          Codes are interchangeable: anything encrypted on the Mac decrypts on Windows and vice versa.

          **Full or small Windows edition?** Both are the same app. The full edition includes everything
          it needs. The small edition is a fraction of the size but needs Microsoft's free .NET Desktop
          Runtime; if it's missing, Windows shows a message with a download link the first time you open it.

          **First launch.** Neither app is signed by Apple or Microsoft yet.
          - Mac: right-click **Number Cipher.app** → **Open**, then confirm.
          - Windows: if SmartScreen appears, click **More info** → **Run anyway**.

          `SHA256SUMS.txt` lets you confirm a download wasn't altered.
          EOF
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Number Cipher $TAG" \
            --notes-file notes.md
