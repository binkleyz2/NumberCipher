name: Release

# Builds the Mac app (Apple Silicon) and the Windows app (x64 + ARM64), then
# publishes them together as one GitHub Release. To cut a new release, change
# the number in VERSION and push to main (or run this workflow from the Actions tab).
on:
  push:
    branches: [main]
    # A changed release workflow also runs; the check job skips versions already released.
    paths: [VERSION, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

  mac:
    needs: check
    if: needs.check.outputs.exists != 'true'
    runs-on: macos-latest   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
      - name: Compatibility self-tests
        run: |
          swiftc -O Sources/CipherCore/*.swift Tests/MacSelfTest/main.swift -o "$RUNNER_TEMP/selftest"
          "$RUNNER_TEMP/selftest"
      - run: |
          chmod +x build.sh
          ./build.sh
          ditto -c -k --keepParent "build/Cipherwords.app" Cipherwords-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: Cipherwords-macOS-arm64.zip

  windows:
    needs: check
    if: needs.check.outputs.exists != 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compatibility self-tests
        run: dotnet run --project windows/InteropTest -c Release
      - name: Build x64 and ARM64 (portable and setup)
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          CWD=$(pwd -W 2>/dev/null || cygpath -m "$(pwd)")
          for arch in x64 arm64; do
            # Portable: self-contained, no .NET runtime needed.
            dotnet publish windows/NumberCipher.Windows -c Release -r win-$arch --self-contained \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=true \
              -p:Version=${{ needs.check.outputs.version }} \
              -o out/$arch
            cp out/$arch/Cipherwords.exe Cipherwords-Windows-$arch-portable.exe
            # Setup: small edition (requires .NET Desktop Runtime 10+), packaged as installer.
            dotnet publish windows/NumberCipher.Windows -c Release -r win-$arch --self-contained false \
              -p:PublishSingleFile=true \
              -p:Version=${{ needs.check.outputs.version }} \
              -o out/$arch-small
            "$ISCC" /O. \
              "/DAppVersion=${{ needs.check.outputs.version }}" \
              "/DExeSource=$CWD/out/$arch-small/Cipherwords.exe" \
              "/DOutputBasename=Cipherwords-Windows-$arch-setup" \
              windows/Cipherwords.iss
          done
          ls -l Cipherwords-Windows-*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Cipherwords-Windows-*.exe

  android:
    needs: check
    if: needs.check.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests
        run: gradle -p android :app:testDebugUnitTest
      - name: Build signed APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          NC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export NC_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          else
            echo "::warning::Android signing secrets are not set; the APK is signed with a temporary key."
          fi
          if ! gradle -p android :app:assembleRelease > "$RUNNER_TEMP/gradle.log" 2>&1; then
            tail -60 "$RUNNER_TEMP/gradle.log"
            echo "::error title=Android build::$(grep -E 'What went wrong|error:|Exception' -A4 "$RUNNER_TEMP/gradle.log" | head -30 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/release.jks"
          cp android/app/build/outputs/apk/release/app-release.apk Cipherwords-Android.apk
          ls -l Cipherwords-Android.apk
          APKSIGNER=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            CERT=$("$APKSIGNER" verify --print-certs Cipherwords-Android.apk 2>&1 | grep -E "certificate (DN|SHA-256)" | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::notice title=APK signer::$CERT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Cipherwords-Android.apk

  publish:
    needs: [check, mac, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          cp recover.py dist/
          (cd dist && sha256sum Cipherwords-* recover.py > SHA256SUMS.txt && cat SHA256SUMS.txt)
          cat > notes.md <<'EOF'
          | Download | For |
          |---|---|
          | `Cipherwords-macOS-arm64.zip` | Mac with Apple Silicon (M1–M4 and newer), macOS 14+ |
          | `Cipherwords-Windows-x64-setup.exe` | Most Windows 10/11 PCs (Intel or AMD) — **recommended**, installs with Start Menu shortcut and File Explorer integration |
          | `Cipherwords-Windows-x64-portable.exe` | Most Windows 10/11 PCs — standalone, no install needed, includes everything |
          | `Cipherwords-Windows-arm64-setup.exe` | Windows on ARM (Snapdragon, Surface Pro X, etc.) — installer |
          | `Cipherwords-Windows-arm64-portable.exe` | Windows on ARM — standalone portable |
          | `Cipherwords-Android.apk` | Android 8.0+ phones, tablets, foldables and Chromebooks |
          | `recover.py` | Decrypts codes on any computer with Python (`pip3 install cryptography`) |

          Codes are interchangeable: anything encrypted on one platform decrypts on the others.
          Since 1.5 the apps are called Cipherwords (formerly Number Cipher), encrypt any text and
          write codes as English words; letter codes made by earlier versions still decrypt.

          **Setup or portable?** The setup installer adds a Start Menu shortcut, an uninstall entry in
          Add/Remove Programs, and automatically registers the File Explorer context menu so you can
          right-click any document to encrypt it. The portable exe is a single file you can run from
          anywhere — it includes a Register/Unregister button in the app to add or remove the context
          menu yourself. The setup installer requires the free [.NET Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0)
          10 or newer; the portable exe includes everything it needs.

          **File Explorer integration** (setup installer only, automatic): right-click any `.docx`,
          `.pdf`, `.xlsx`, `.csv`, `.txt` and many other document types to encrypt them directly.
          Double-click any `.cipherwords` file to decrypt it.

          **First launch.** None of the apps come from an app store yet.
          - Mac: right-click **Cipherwords.app** → **Open**, then confirm.
          - Windows: if SmartScreen appears, click **More info** → **Run anyway**.
          - Android: open the APK on the phone and allow your browser or file manager to
            **install unknown apps** when asked. Play Protect may ask you to confirm; choose **Install anyway**.

          `SHA256SUMS.txt` lets you confirm a download wasn't altered.
          EOF
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Cipherwords $TAG" \
            --notes-file notes.md
