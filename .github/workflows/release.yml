name: Release

# Builds the Mac app (Apple Silicon) and the Windows app (x64 + ARM64), then
# publishes them together as one GitHub Release. To cut a new release, change
# the number in VERSION and push to main (or run this workflow from the Actions tab).
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

  mac:
    needs: check
    if: needs.check.outputs.exists != 'true'
    runs-on: macos-latest   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
      - run: |
          chmod +x build.sh
          ./build.sh
          ditto -c -k --keepParent "build/Number Cipher.app" NumberCipher-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: NumberCipher-macOS-arm64.zip

  windows:
    needs: check
    if: needs.check.outputs.exists != 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compatibility self-tests
        run: dotnet run --project windows/InteropTest -c Release
      - name: Build x64 and ARM64 (full and small editions)
        run: |
          for arch in x64 arm64; do
            # Full: bundles the .NET runtime, runs on any PC with nothing installed.
            dotnet publish windows/NumberCipher.Windows -c Release -r win-$arch --self-contained \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=true \
              -p:Version=${{ needs.check.outputs.version }} \
              -o out/$arch
            cp out/$arch/NumberCipher.exe NumberCipher-Windows-$arch.exe
            # Small: uses the PC's installed .NET Desktop Runtime (10 or newer).
            dotnet publish windows/NumberCipher.Windows -c Release -r win-$arch --self-contained false \
              -p:PublishSingleFile=true \
              -p:Version=${{ needs.check.outputs.version }} \
              -o out/$arch-small
            cp out/$arch-small/NumberCipher.exe NumberCipher-Windows-$arch-small.exe
          done
          ls -l NumberCipher-Windows-*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: NumberCipher-Windows-*.exe

  android:
    needs: check
    if: needs.check.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests
        run: gradle -p android :app:testDebugUnitTest
      - name: Build signed APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          NC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export NC_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          else
            echo "::warning::Android signing secrets are not set; the APK is signed with a temporary key."
          fi
          gradle -p android :app:assembleRelease
          rm -f "$RUNNER_TEMP/release.jks"
          cp android/app/build/outputs/apk/release/app-release.apk NumberCipher-Android.apk
          "$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs NumberCipher-Android.apk | grep -E "Signer #1 certificate (DN|SHA-256)"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: NumberCipher-Android.apk

  publish:
    needs: [check, mac, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          cp recover.py dist/
          (cd dist && sha256sum NumberCipher-* recover.py > SHA256SUMS.txt && cat SHA256SUMS.txt)
          cat > notes.md <<'EOF'
          | Download | For |
          |---|---|
          | `NumberCipher-macOS-arm64.zip` | Mac with Apple Silicon (M1–M4 and newer), macOS 14+ |
          | `NumberCipher-Windows-x64.exe` | Most Windows 10/11 PCs (Intel or AMD) |
          | `NumberCipher-Windows-arm64.exe` | Windows on ARM (Snapdragon, Surface Pro X, etc.) |
          | `NumberCipher-Windows-x64-small.exe` | Small edition for Intel/AMD PCs that have the [.NET Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0) 10 or newer installed |
          | `NumberCipher-Windows-arm64-small.exe` | Small edition for Windows on ARM, same requirement |
          | `NumberCipher-Android.apk` | Android 8.0+ phones, tablets, foldables and Chromebooks |
          | `recover.py` | Decrypts codes on any computer with Python (`pip3 install cryptography`) |

          Codes are interchangeable: anything encrypted on one platform decrypts on the others.

          **Full or small Windows edition?** Both are the same app. The full edition includes everything
          it needs. The small edition is a fraction of the size but needs Microsoft's free .NET Desktop
          Runtime; if it's missing, Windows shows a message with a download link the first time you open it.

          **First launch.** None of the apps come from an app store yet.
          - Mac: right-click **Number Cipher.app** → **Open**, then confirm.
          - Windows: if SmartScreen appears, click **More info** → **Run anyway**.
          - Android: open the APK on the phone and allow your browser or file manager to
            **install unknown apps** when asked. Play Protect may ask you to confirm; choose **Install anyway**.

          `SHA256SUMS.txt` lets you confirm a download wasn't altered.
          EOF
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Number Cipher $TAG" \
            --notes-file notes.md
